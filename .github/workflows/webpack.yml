name: Locked Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # Cold Windows tools/builds and the full Rust/browser suite can take over 43 minutes.
    timeout-minutes: 60
    env:
      # Preserve the compiler dependency path used by the supported WASM build.
      CARGO_HOME: 'C:\Users\Spring\.cargo'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Check repository contents
        run: node scripts/check-repository.mjs
      - name: Prepare the project tools
        run: pwsh -NoProfile -File scripts/setup.ps1
      - name: Install locked dependencies
        run: pwsh -NoProfile -File scripts/task.ps1 ci
      - name: Build Rust and Vite application
        id: product_build
        run: pwsh -NoProfile -File scripts/task.ps1 build
      - name: Check TypeScript
        run: pwsh -NoProfile -File scripts/task.ps1 typecheck
      - name: Check source quality
        run: pwsh -NoProfile -File scripts/task.ps1 lint
      - name: Check formatting
        run: pwsh -NoProfile -File scripts/task.ps1 format:check
      - name: Run frontend unit tests
        run: pwsh -NoProfile -File scripts/task.ps1 test --maxWorkers=1
      - name: Check Rust and run workspace tests
        if: ${{ !cancelled() && steps.product_build.outcome == 'success' }}
        run: pwsh -NoProfile -File scripts/task.ps1 check:rust
      - name: Test optional AI gateway
        if: ${{ !cancelled() && steps.product_build.outcome == 'success' }}
        run: pwsh -NoProfile -File scripts/task.ps1 test:ai-proxy
      - name: Install the pinned Chromium browser
        if: ${{ !cancelled() && steps.product_build.outcome == 'success' }}
        run: pwsh -NoProfile -File scripts/task.ps1 browser:install:chromium
      - name: Check learning and editing workflows
        if: ${{ !cancelled() && steps.product_build.outcome == 'success' }}
        run: pwsh -NoProfile -File scripts/task.ps1 test:workflow
