[workspace]
members = ["engine/core", "engine/wasm", "engine/algorithm", "engine/algorithm-wasm", "engine/memory", "engine/memory-wasm", "engine/advanced", "engine/advanced-wasm", "engine/practice-generator", "engine/practice-generator-wasm", "engine/c6", "engine/c6-wasm", "engine/cpp-course"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
