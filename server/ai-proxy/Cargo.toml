[package]
name = "c-viz-ai-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "fs"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "stream"] }
jsonschema = { version = "=0.60.2", default-features = false }
tower-http = { version = "=0.7.1", features = ["fs"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
futures-util = "=0.3.32"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util", "io-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
