[package]
name = "c-viz-java"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
members = ["wasm"]
resolver = "3"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
