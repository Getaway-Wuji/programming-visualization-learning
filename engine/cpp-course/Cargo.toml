[package]
name = "c-viz-cpp-course-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
c-viz-advanced = { path = "../advanced", features = ["cpp-course"] }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
