[package]
name = "c-viz-mysql"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
members = ["wasm"]
resolver = "3"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.129"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# sqlparser's unoptimized recursive frames exceed the native harness stack
# before the frozen recursion guard can fire. Keep the parser itself optimized
# in native development/test builds, as it is in the browser release build.
[profile.dev.package.sqlparser]
opt-level = 2

[profile.test.package.sqlparser]
opt-level = 2
