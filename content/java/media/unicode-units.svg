<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
  <title id="title">树和微笑符号在UTF-16中的长度</title>
  <desc id="desc">树的码点U6811使用一个代码单元，微笑符号的码点U1F642使用D83D和DE42两个代理单元。这个字符串的length为3，码点数量为2。</desc>
  <rect width="1100" height="530" rx="16" fill="#f7f9fc"/>
  <g font-family="Microsoft YaHei,Noto Sans SC,sans-serif" fill="#182b42">
    <text x="48" y="53" font-size="29" font-weight="700">同一段文字，可以按不同单位计数</text>
    <text x="48" y="109" font-size="24">字符串内容</text>
    <text x="365" y="117" text-anchor="middle" font-size="40">树</text>
    <text x="755" y="117" text-anchor="middle" font-size="40" font-family="Segoe UI Emoji,Microsoft YaHei,sans-serif">🙂</text>
    <text x="48" y="207" font-size="24">Unicode 码点</text>
    <rect x="245" y="157" width="240" height="80" rx="10" fill="#e2f1e9" stroke="#7b9e8b" stroke-width="2"/>
    <rect x="505" y="157" width="500" height="80" rx="10" fill="#e7effb" stroke="#88a2c6" stroke-width="2"/>
    <text x="365" y="207" text-anchor="middle" font-size="26">U+6811</text>
    <text x="755" y="207" text-anchor="middle" font-size="26">U+1F642</text>
    <path d="M365 237V278M755 237V258H625V278M755 258H885V278" fill="none" stroke="#61758c" stroke-width="2"/>
    <text x="48" y="329" font-size="24">UTF-16 代码单元</text>
    <rect x="245" y="280" width="240" height="80" rx="10" fill="#e2f1e9" stroke="#7b9e8b" stroke-width="2"/>
    <rect x="505" y="280" width="240" height="80" rx="10" fill="#e7effb" stroke="#88a2c6" stroke-width="2"/>
    <rect x="765" y="280" width="240" height="80" rx="10" fill="#e7effb" stroke="#88a2c6" stroke-width="2"/>
    <text x="365" y="330" text-anchor="middle" font-size="26">0x6811</text>
    <text x="625" y="330" text-anchor="middle" font-size="26">0xD83D</text>
    <text x="885" y="330" text-anchor="middle" font-size="26">0xDE42</text>
    <text x="48" y="400" font-size="24">String 下标</text>
    <text x="365" y="400" text-anchor="middle" font-size="24">0</text>
    <text x="625" y="400" text-anchor="middle" font-size="24">1</text>
    <text x="885" y="400" text-anchor="middle" font-size="24">2</text>
    <path d="M48 430H1052" stroke="#ccd8e5" stroke-width="2"/>
    <text x="48" y="477" font-size="25" font-weight="700">length() = 3</text>
    <text x="395" y="477" font-size="25">码点数量 = 2</text>
    <text x="710" y="477" font-size="21" fill="#425267">🙂的两个单元组成代理对</text>
  </g>
</svg>
