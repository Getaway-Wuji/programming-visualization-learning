<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-labelledby="title desc">
  <title id="title">Java源码、字节码与运行环境</title>
  <desc id="desc">Java源文件经javac编译为class字节码。同一份符合目标版本的字节码由Windows、Linux或macOS各自的JVM加载执行。依赖和环境配置仍须匹配。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#43576c"/></marker></defs>
  <rect width="880" height="350" rx="12" fill="#f8fafc"/>
  <g fill="#fff" stroke="#65778a" stroke-width="1.5">
    <rect x="24" y="122" width="150" height="88" rx="8"/>
    <rect x="324" y="122" width="156" height="88" rx="8"/>
    <rect x="642" y="24" width="210" height="76" rx="8"/>
    <rect x="642" y="128" width="210" height="76" rx="8"/>
    <rect x="642" y="232" width="210" height="76" rx="8"/>
  </g>
  <g stroke="#43576c" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M174 166H310"/>
    <path d="M480 166H552V62H628"/>
    <path d="M480 166H628"/>
    <path d="M480 166H552V270H628"/>
  </g>
  <g font-family="Arial,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#172b40">
    <text x="99" y="157" font-size="21">.java 文件</text>
    <text x="99" y="185" font-size="17">源代码</text>
    <text x="244" y="140" font-size="19">javac 编译</text>
    <text x="402" y="157" font-size="21">.class 文件</text>
    <text x="402" y="185" font-size="17">字节码</text>
    <text x="747" y="55" font-size="19">Windows 的 JVM</text>
    <text x="747" y="81" font-size="16">加载与执行</text>
    <text x="747" y="159" font-size="19">Linux 的 JVM</text>
    <text x="747" y="185" font-size="16">加载与执行</text>
    <text x="747" y="263" font-size="19">macOS 的 JVM</text>
    <text x="747" y="289" font-size="16">加载与执行</text>
    <text x="440" y="334" font-size="16">字节码版本、依赖与环境配置需要匹配</text>
  </g>
</svg>
