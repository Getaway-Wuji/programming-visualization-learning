<svg xmlns="http://www.w3.org/2000/svg" width="560" height="760" viewBox="0 0 560 760" role="img" aria-labelledby="title desc">
  <title id="title">C函数收到指针值的副本，仍可修改同一个目标</title>
  <desc id="desc">main中的pointer和change中的形参副本起初都指向value。通过副本写入11改变value；再把形参设为空，不改变main中的pointer。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#236b60" stroke-width="1.5"/></marker></defs>
  <rect width="560" height="760" rx="18" fill="#f7faf9"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#142b29">
    <text x="28" y="49" font-size="30" font-weight="700">复制的是地址，目标仍是同一个</text>
    <text x="28" y="92" font-size="25">① 调用 change(pointer)</text>
    <rect x="28" y="116" width="238" height="106" rx="12" fill="#fff" stroke="#8ba9a1"/>
    <rect x="294" y="116" width="238" height="106" rx="12" fill="#fff" stroke="#8ba9a1"/>
    <text x="45" y="155" font-size="24">main 的 pointer</text>
    <text x="45" y="192" font-size="24">保存 value 的地址</text>
    <text x="310" y="155" font-size="24">change 的形参</text>
    <text x="310" y="192" font-size="24">收到地址副本</text>
    <path d="M147 222V247L235 286" fill="none" stroke="#236b60" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M413 222V247L325 286" fill="none" stroke="#236b60" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="158" y="290" width="244" height="83" rx="12" fill="#deeee8" stroke="#236b60"/>
    <text x="188" y="342" font-size="28" font-weight="700">value：4 → 11</text>
    <text x="28" y="414" font-size="25">② *pointer = 11 写进原对象</text>
    <text x="28" y="461" font-size="25">③ 形参 pointer = 0</text>
    <rect x="28" y="486" width="238" height="112" rx="12" fill="#fff" stroke="#8ba9a1"/>
    <rect x="294" y="486" width="238" height="112" rx="12" fill="#fff" stroke="#8ba9a1"/>
    <text x="45" y="529" font-size="24">main 的 pointer</text>
    <text x="45" y="568" font-size="24">仍指向 value</text>
    <text x="310" y="529" font-size="24">change 的形参</text>
    <text x="310" y="568" font-size="24">现在是空指针</text>
    <path d="M147 598V624H280" fill="none" stroke="#236b60" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="294" y="607" width="238" height="70" rx="12" fill="#deeee8"/>
    <text x="320" y="652" font-size="27">value 仍为 11</text>
    <text x="28" y="721" font-size="25">结果：value=11，same=1</text>
  </g>
</svg>
