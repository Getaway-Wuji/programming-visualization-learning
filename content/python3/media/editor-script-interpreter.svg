<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" role="img" aria-labelledby="title desc">
  <title id="title">编辑、保存、运行与检查结果</title>
  <desc id="desc">在编辑器中修改代码，保存为.py文件，用选中的Python解释器运行，最后检查输出或错误诊断。改动后要再次保存并运行，形成学习实验闭环。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#43576c"/></marker></defs>
  <rect width="880" height="290" rx="12" fill="#f8fafc"/>
  <g fill="#fff" stroke="#65778a" stroke-width="1.5"><rect x="24" y="65" width="170" height="100" rx="8"/><rect x="246" y="65" width="170" height="100" rx="8"/><rect x="468" y="65" width="170" height="100" rx="8"/><rect x="690" y="65" width="166" height="100" rx="8"/></g>
  <g stroke="#43576c" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M194 115H232"/><path d="M416 115H454"/><path d="M638 115H676"/><path d="M774 180V226H110V180"/></g>
  <g font-family="Arial,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#172b40">
    <text x="109" y="104" font-size="21">编辑器</text><text x="109" y="135" font-size="17">修改源码</text>
    <text x="331" y="104" font-size="21">.py 文件</text><text x="331" y="135" font-size="17">保存的源码</text>
    <text x="553" y="104" font-size="21">Python 解释器</text><text x="553" y="135" font-size="17">读取与执行</text>
    <text x="773" y="104" font-size="21">输出或诊断</text><text x="773" y="135" font-size="17">与预期比较</text>
    <text x="440" y="263" font-size="18">带着观察修改一个地方，再保存、运行、核对</text>
  </g>
</svg>
